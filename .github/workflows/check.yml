name: check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Python scripts, examples and test vectors: everything in scripts/check.sh.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: scripts/check.sh
        env:
          PYTHON: python

  # The Go reference implementation, on the oldest Go that go.mod supports,
  # including a govulncheck scan on the newest patch of that Go release.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # go.mod's version (1.26.0) is only the oldest Go the module builds with;
      # scan the newest patch of that release, which carries the security fixes.
      - name: govulncheck (newest patch of the minimum Go from go.mod)
        run: |
          floor="$(go list -m -f '{{.GoVersion}}' | cut -d. -f1,2)"
          patch="$(go list -m -f '{{.Version}}' "go@${floor}")"
          echo "govulncheck on go${patch}"
          GOTOOLCHAIN="go${patch}" go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # staticcheck needs a recent Go, so it runs on the current stable release.
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  # Known-vulnerability scan. govulncheck checks the Go module's dependencies
  # and the standard library of the Go it runs on (the current stable release);
  # pip-audit checks requirements.txt. Either fails the job on a known vulnerability.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck (Go module)
        env:
          GOTOOLCHAIN: local
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt
